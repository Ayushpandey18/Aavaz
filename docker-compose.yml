services:
  # =========================
  # AAVAZ API
  # =========================
  aavaz-api:
    build:
      context: .
      dockerfile: Dockerfile
    image: aavaz:v1.0.0
    container_name: aavaz-api

    restart: unless-stopped

    env_file:
      - .env

    environment:
      NODE_ENV: development
      REDIS_URL: redis://redis:6379

    ports:
      - "5001:5001"

    volumes:
      - .:/app
      - /app/node_modules

    command: npm run dev

    depends_on:
      redis:
        condition: service_healthy

    networks:
      - aavaz-network


  # =========================
  # BULLMQ WORKER
  # =========================
  aavaz-worker:
    build:
      context: .
      dockerfile: Dockerfile
    image: aavaz:v1.0.0
    container_name: aavaz-worker

    restart: unless-stopped

    env_file:
      - .env

    environment:
      NODE_ENV: development
      REDIS_URL: redis://redis:6379

    volumes:
      - .:/app
      - /app/node_modules

    command: npm run workers

    depends_on:
      redis:
        condition: service_healthy

    networks:
      - aavaz-network


  # =========================
  # REDIS
  # =========================
  redis:
    image: redis:7-alpine

    container_name: aavaz-redis

    restart: unless-stopped

    command: redis-server --appendonly yes

    volumes:
      - redis-data:/data

    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

    networks:
      - aavaz-network


# =========================
# NETWORKS
# =========================
networks:
  aavaz-network:
    driver: bridge


# =========================
# VOLUMES
# =========================
volumes:
  redis-data: